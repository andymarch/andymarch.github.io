- title: "OAuth by Example Workshop"
  event: "API Days Paris"
  date: "2019-12-09"
  deck_url: "https://speakerdeck.com/andymarch/oauth-by-example-workshop"
  video_url:
  abstract: >-
    Authentication and authorization has come a long way in the last ten
    years. Are you still rolling your own identity? Don't know the
    differences between the authorization code grant and the client
    credentials grant? Do you want to accept social authentication to your
    service but you're not sure how? This workshop reviews OAuth and OIDC,
    their history, the problems they solve and how to apply them to your
    services, including configuring Okta as an identity provider and
    deploying a simple web app enforcing authentication and authorization.

- title: "Customers in the Crosshairs"
  event: "API Days Paris"
  date: "2019-12-10"
  deck_url: "https://speakerdeck.com/andymarch/customers-in-the-crosshairs"
  video_url:
  abstract: >-
    As users now expect more from the organisations they interact with
    online, managing the identity of your customers is becoming much more
    complex. Password dumps, multiple devices and poor MFA adoption put
    pressure on security and development teams, all while your competition
    waits in the wings to offer an alternative if your offering doesn't meet
    the customer's expectations.

- title: "Avoid losing customers with a poor registration solution"
  event: "Cloudworks Norway"
  date: "2021-01-21"
  deck_url:
  video_url: "https://info.cloudworks.no/opptak-webinar-ciam"
  abstract: >-
    Together with Andy March, IAM architect Arne Vedø-Hansen at Cloudworks
    talks about how a Customer Identity and Access Management (CIAM)
    solution enables a company to offer a secure registration and login
    experience for its customers.

- title: "Captivate Your Target Audience with an All-Around Customer Identity Experience"
  event: "Oktane21"
  date: "2021-04-19"
  deck_url:
  video_url: "https://www.youtube.com/watch?v=UkzOp7D69LQ&list=PLIid085fSVduHYQWZhm5vqcIK9m_BYYZ3"
  abstract: >-
    Great customer experiences are no longer just nice to have, they're a key
    differentiator between you and your competitors. Achieving a true
    360-degree view of your users requires a digital identity platform that
    tracks all of their interactions online and offline, while ensuring a
    secure, seamless and straightforward experience at every touch point
    along the customer journey.

- title: "Customers in the Crosshairs"
